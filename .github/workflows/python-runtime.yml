name: Code Relay Python runtime

on:
  push:
    paths:
      - "code_relay/**"
      - "tests/**"
      - "schemas/**"
      - "pyproject.toml"
      - ".github/workflows/python-runtime.yml"
  pull_request:
    paths:
      - "code_relay/**"
      - "tests/**"
      - "schemas/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q code_relay tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install --disable-pip-version-check pip-audit
      - run: python -m pip_audit --strict --no-deps

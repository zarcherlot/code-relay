name: Code Relay release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  actions: write
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: false
      - name: Build release artifacts
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $VERSION" >&2
            exit 1
          fi
          version="${VERSION#v}"
          mkdir -p dist
          for target in "linux amd64 code-relay-agent-linux-amd64" "linux arm64 code-relay-agent-linux-arm64" "windows amd64 code-relay-agent-windows-amd64.exe" "darwin amd64 code-relay-agent-darwin-amd64" "darwin arm64 code-relay-agent-darwin-arm64"; do
            read -r goos goarch name <<<"$target"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/$name" ./cmd/code-relay-agent
          done
          test "$(./dist/code-relay-agent-linux-amd64 version)" = "code-relay-agent $version"
          printf '{"product":"Code Relay","version":"%s","module":"github.com/zarcherlot/code-relay","source_commit":"%s","go_version":"%s"}\n' "$version" "$GITHUB_SHA" "$(go version)" > dist/release.json
          printf '{"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"metadata":{"component":{"type":"application","name":"code-relay-agent","version":"%s"}},"components":[]}\n' "$version" > dist/sbom.cdx.json
          (cd dist && sha256sum * > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Verify release contract
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/verify-release.ps1 -Path dist -Version $version
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/*"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
      - name: Dispatch npm and MCP Registry publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-mcp.yml --ref "${GITHUB_REF_NAME}" -f version="${GITHUB_REF_NAME}"

name: Code Relay release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build release artifacts
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist
          for target in "linux amd64 code-relay-agent-linux-amd64" "linux arm64 code-relay-agent-linux-arm64" "windows amd64 code-relay-agent-windows-amd64.exe" "darwin amd64 code-relay-agent-darwin-amd64" "darwin arm64 code-relay-agent-darwin-arm64"; do
            read -r goos goarch name <<<"$target"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/$name" ./cmd/code-relay-agent
          done
          printf '{"product":"Code Relay","version":"%s","module":"github.com/zarcherlot/code-relay"}\n' "$version" > dist/release.json
          sha256sum dist/* > dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes

name: Code Relay Go agent

on:
  push:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/go-agent.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Linux and Windows agents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/code-relay-agent-linux-amd64 ./cmd/code-relay-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/code-relay-agent-linux-arm64 ./cmd/code-relay-agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/code-relay-agent-windows-amd64.exe ./cmd/code-relay-agent
      - uses: actions/upload-artifact@v4
        with:
          name: code-relay-agent
          path: dist/

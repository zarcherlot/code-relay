name: Code Relay - verify on B

on:
  push:
    paths:
      - "tasks/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-relay-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, codex-b]
    timeout-minutes: 30
    steps:
      - name: Checkout task commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find and verify new tasks
        shell: bash
        run: |
          set -euo pipefail
          test -x bin/code-relay-agent || chmod +x bin/code-relay-agent
          ./bin/code-relay-agent run-pending --root . --timeout 1800
      - name: Commit receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "code-relay-bot"
          git config user.email "code-relay-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          ./bin/code-relay-agent publish-receipts --root .

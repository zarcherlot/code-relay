name: Code Relay Go runtime

on:
  workflow_dispatch:
  push:
    tags-ignore:
      - "v*.*.*"
    paths:
      - "cmd/**"
      - "internal/**"
      - "schemas/**"
      - "scripts/**"
      - "examples/**"
      - "deploy/**"
      - ".codex-plugin/**"
      - ".mcp.json"
      - "go.mod"
      - "README*.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/workflows/go-runtime.yml"
      - "Dockerfile"
      - ".dockerignore"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "schemas/**"
      - "scripts/**"
      - "examples/**"
      - "deploy/**"
      - ".codex-plugin/**"
      - ".mcp.json"
      - "go.mod"
      - "README*.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "Dockerfile"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(find cmd internal -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"
      - run: go test ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - run: go vet ./...
      - name: Validate protocol and plugin contracts
        shell: pwsh
        run: ./scripts/validate-contracts.ps1
      - name: Run local end-to-end smoke test
        shell: pwsh
        run: ./scripts/smoke-e2e.ps1
      - name: Check patch whitespace
        shell: bash
        run: git diff --check
      - name: Package and smoke-test plugin
        shell: pwsh
        run: ./scripts/package-plugin.ps1 -Output dist/plugin-smoke

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: false
      - name: Build all supported targets
        run: ./scripts/build-agent.sh dist
      - name: Reject committed credential patterns
        shell: bash
        run: |
          if git grep -nE '(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})'; then
            echo "possible credential committed to the repository" >&2
            exit 1
          fi
      - name: Verify checksums and Linux binary
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          expected_version="$(jq -er '.version | split("+")[0]' ../.codex-plugin/plugin.json)"
          actual_version="$(./code-relay-agent-linux-amd64 version)"
          echo "Expected: code-relay-agent ${expected_version}"
          echo "Actual:   ${actual_version}"
          test "$actual_version" = "code-relay-agent ${expected_version}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-relay-agent
          path: dist/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build remote MCP gateway image
        run: docker build --pull -t code-relay-mcp:ci .

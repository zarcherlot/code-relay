name: Code Relay - checkpoint

on:
  push:
    tags-ignore:
      - "v*.*.*"
    paths:
      - "runbooks/**"
  workflow_dispatch:
    inputs:
      runbook_id:
        description: Optional runbook identifier supplied by the Relay gateway
        required: false

permissions:
  contents: write

concurrency:
  group: code-relay-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: [self-hosted, code-relay-checkpoint]
    timeout-minutes: 30
    steps:
      - name: Checkout runbook commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          # The checkpoint job may need to fetch the source commit referenced
          # by a runbook from this private repository. Keep the short-lived
          # Actions token in git config for that fetch, then the runner
          # workspace is discarded after the job.
          persist-credentials: true
      - name: Verify preinstalled Go
        shell: pwsh
        run: go version
      - name: Select and build matching agent
        shell: pwsh
        run: |
          $target = "$env:RUNNER_OS/$env:RUNNER_ARCH"
          switch ($target) {
            "Linux/X64" { $goos = "linux"; $goarch = "amd64"; $name = "code-relay-agent-linux-amd64" }
            "Linux/ARM64" { $goos = "linux"; $goarch = "arm64"; $name = "code-relay-agent-linux-arm64" }
            "macOS/X64" { $goos = "darwin"; $goarch = "amd64"; $name = "code-relay-agent-darwin-amd64" }
            "macOS/ARM64" { $goos = "darwin"; $goarch = "arm64"; $name = "code-relay-agent-darwin-arm64" }
            "Windows/X64" { $goos = "windows"; $goarch = "amd64"; $name = "code-relay-agent-windows-amd64.exe" }
            "Windows/ARM64" { $goos = "windows"; $goarch = "arm64"; $name = "code-relay-agent-windows-arm64.exe" }
            default { throw "unsupported runner: $target" }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = $goos
          $env:GOARCH = $goarch
          go build -trimpath -ldflags "-s -w" -o "dist/$name" ./cmd/code-relay-agent
          "CODE_RELAY_AGENT=$PWD/dist/$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Fetch runbook source commits
        shell: pwsh
        run: |
          $sources = Get-ChildItem -Path runbooks -Recurse -Filter runbook.md -File | ForEach-Object {
            Select-String -Path $_.FullName -Pattern '^- source_commit:\s*([0-9a-fA-F]{7,64})\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          } | Sort-Object -Unique
          foreach ($source in $sources) {
            git cat-file -e "$source^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              # GitHub does not advertise arbitrary SHA wants on private
              # repositories. Deepen the checked-out branch instead, then
              # verify that the referenced commit is available locally.
              $shallow = (git rev-parse --is-shallow-repository 2>$null).Trim()
              if ($shallow -eq "true") {
                git fetch --no-tags --unshallow origin "$env:GITHUB_REF_NAME"
              } else {
                git fetch --no-tags origin "$env:GITHUB_REF_NAME"
              }
              if ($LASTEXITCODE -ne 0) { throw "failed to fetch branch history for source commit $source" }
              git cat-file -e "$source^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) { throw "source commit $source is not reachable from $env:GITHUB_REF_NAME" }
            }
          }
      - name: Execute pending runbooks
        shell: pwsh
        run: |
          & $env:CODE_RELAY_AGENT run-pending --root . --timeout 1800
      - name: Commit receipts
        shell: pwsh
        run: |
          git config user.name "code-relay-bot"
          git config user.email "code-relay-bot@users.noreply.github.com"
          & $env:CODE_RELAY_AGENT publish-receipts --root .

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-relay"
version = "1.0.0"
description = "Git-backed two-host Codex development and verification loop"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/zarcherlot/code-relay"
Repository = "https://github.com/zarcherlot/code-relay"

[project.scripts]
code-relay = "code_relay.relay:main"
code-relay-daemon = "code_relay.daemon:main"

[tool.setuptools.packages.find]
include = ["code_relay*"]

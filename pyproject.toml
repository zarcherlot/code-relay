[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-relay"
version = "0.4.0"
description = "Git-backed two-host Codex development and verification loop"
requires-python = ">=3.10"

[project.scripts]
code-relay = "code_relay.relay:main"
codex-relay = "code_relay.relay:main"
relay = "codex_relay.relay:main"
code-relay-daemon = "code_relay.daemon:main"
codex-relay-daemon = "code_relay.daemon:main"
relay-daemon = "code_relay.daemon:main"

[tool.setuptools.packages.find]
include = ["codex_mate*", "codex_relay*", "code_relay*"]
